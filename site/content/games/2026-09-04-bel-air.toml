# One game = one file. Everything downstream (site result + recap page, the
# Keys to the Game card, the school's score form) is generated from this.
#
#   uv run python -m jcvb.postgame summary     2026-09-04-bel-air
#   uv run python -m jcvb.postgame report-card 2026-09-04-bel-air --out <vault path>
#   uv run python -m jcvb.postgame form-url    2026-09-04-bel-air

[game]
date = "2026-09-04"
opponent = "Bel Air"
designation = "scrimmage"        # scrimmages never touch the W-L record
home_away = "home"
# [JC, opponent] per set, in order.
sets = [[25, 10], [25, 19], [25, 12]]

# Per-set tallies from the assistant coach's sheet, one entry per set.
[stats]
aces                 = [6, 2, 6]
service_errors       = [3, 7, 4]
kills                = [12, 10, 6]
blocks               = [0, 0, 1]
attack_errors        = [1, 3, 1]
communication_errors = [0, 2, 0]
net_violations       = [1, 0, 1]
doubles_lifts        = [0, 0, 0]

# Read off the official book: the running score at the END of each service term,
# in order, for each team. Service terms strictly alternate, so these replay the
# set — the diffs are the scoring runs, and interleaving them settles the race to
# 15. `postgame` refuses to load this unless each set's last value matches the
# set score above, which is what catches a misread digit.
#
# first_serve is TK's account: received S1 and S3, served S2. See [notes].first_serve
# for the one place that required adding a term the book did not record.
[scorebook]
first_serve = ["opp", "jc", "opp"]
jc = [
  [4, 6, 10, 13, 18, 21, 23, 25],
  [0, 2, 3, 6, 9, 13, 13, 16, 21, 25],
  [8, 9, 12, 17, 19, 20, 21, 22, 24, 25],
]
opp = [
  [1, 2, 4, 5, 7, 9, 10, 10],
  [4, 7, 8, 9, 10, 11, 12, 16, 19],
  [0, 1, 2, 3, 5, 6, 7, 8, 11, 12],
]

# [serve_receive] is deliberately absent — see [notes].serve_receive. The sheet
# that came back for this match is a single aggregated 3/2/1/0 tally per player
# with no per-set split and no aces-conceded row, so it cannot be transcribed
# into the per-set digit strings this table expects. Do not guess it.

[card]
writeup = "(write-up to come)"

[recap]
headline = "Patriots sweep Bel Air in home scrimmage"
body = """
John Carroll opened the home slate with a 3-0 scrimmage win over Bel Air, \
25-10, 25-19, 25-12, and the afternoon belonged to the whole roster — every \
player who came off the bench found a way into the result. It started with the \
passing: a 2.5 team serve-receive rating, up nearly a full point on the season \
opener, with Nathan Magness, Tyler Olivi, Logan Sosnowki and Andrew Hall all \
excellent in the back court. That platform let the Patriots run their whole \
offense, and three different setters — Mason Proctor, Gregg Wisniewski and Luke \
Boyle — shared the assists. It turned into 28 kills across the three sets, led \
by an outstanding day from Peyton Williams on the outside, twelve of them in a \
first set John Carroll controlled from the opening whistle. The serve did real \
damage too: 14 aces on the day, six in the first set and six more in the third. \
Bel Air pushed hardest in the second, answering an early John Carroll lead and \
trading runs into the twenties before the Patriots closed it out. A complete \
team performance to build on.\
"""

# Rows the tally sheet cannot answer — one mark per set (✅/❌, or a dot to
# leave unanswered). Fill these in and re-run report-card.
[report_card]
rotation        = "..."
meet_center     = "..."
no_complaints   = "..."
energy          = "✅✅✅"   # TK: "a dominating day for the Patriots where everyone contributed"
sr_rating       = "✅✅✅"   # 2.5 team rating, confirmed by TK — match figure, no per-set split
run_5           = "..."
no_opp_run      = "..."
defensive_play  = "✅✅✅"   # TK: "the entire defense ... had stellar serve receive"

# Optional per-row comments on the report card, keyed by criterion.
[notes]
transcription = """
The tally sheet skews on the clipboard, so every circled total was cross-checked \
against its tally marks. All eight rows agree except one cell:

- **S2 Service Errors** — the tally marks read `卌 II` (7) and the circled total \
reads as either `7` or `9`. **7, confirmed by TK.**

Everything else is a clean match, and the book's set scores agree with the tally \
sheet's W/W/W result row.
"""

first_serve = """
Settled by TK: **received S1 and S3, served S2.** Neither the lineup sheet's S/R \
boxes (R/R/S) nor a naive read of the book matches that on its own.

S2 and S3 fall straight out of the book. S1 did not: the book records eight John \
Carroll service terms to Bel Air's seven, which alternates only if JC served \
first. Receiving requires an eighth Bel Air term, and there is exactly one place \
it can go — a zero-point term between JC's 23rd and 24th points, where Bel Air \
won serve back and lost the rally immediately. The scorer did not write that bare \
end-of-serve mark down. It is added here as the trailing repeated `10`.

The lineup sheet's S/R box was wrong for S2 and S3 either way. Worth a look at \
how that box gets filled in before it drives starting zones on a card that counts.
"""

serve_receive = """
**Team rating 2.5 — confirmed by TK, but not reconstructable per set.**

The sheet that came back is a hand-drawn grid on the back of the Bel Air \
scouting report: one row per player, columns 3/2/1/0, tallied for the whole \
match. No per-set split and no aces-conceded row, so it cannot go into the \
[serve_receive] table, and `aces_against` is unknown for this match.

Read as marked: Olivi 3×4/1×1/0×1, Williams 3×4/2×1, Hall 3×2/2×1/1×1, \
Magness 3×2, Sosnowki 3×2 — 48 points over 19 receptions = **2.53**. Butler, \
DeReamer, Gostomski and Young have no marks.

Nineteen receptions is light for three sets; Bel Air missing a good number of \
serves accounts for some of it. TK confirmed 2.5 as the right number, so the \
SR row is marked off it — but it is a match figure applied to all three sets, \
not three measured sets.
"""

kills = "28 kills — S1 12, S2 10, S3 6"
aces_over_se = "S1 6-3 and S3 6-4; S2 went the other way at 2-7"
service_errors = "14 SE, level with our 14 aces — the S2 spike (7) is where the set got close"
blocks = "1 block in three sets (S3). Same row we failed against Harford Tech"
setters = "Proctor, Wisniewski and Boyle all tallied assists (TK) — the book and tally sheet do not record assists"
