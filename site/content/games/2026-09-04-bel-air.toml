# One game = one file. Everything downstream (site result + recap page, the
# Keys to the Game card, the school's score form) is generated from this.
#
#   uv run python -m jcvb.postgame summary     2026-09-04-bel-air
#   uv run python -m jcvb.postgame report-card 2026-09-04-bel-air --out <vault path>
#   uv run python -m jcvb.postgame form-url    2026-09-04-bel-air
#
# NOTE (2026-09-05): the original 9/4 game file was missing from both the vault
# folder and site/content/games — only the rendered stats note and report card
# survived. This file was rebuilt from those two artifacts (set scores, tallies,
# recap) plus a fresh transcription of the scorebook scans and the Hudl Assist
# export. See [notes] transcription.

[game]
date = "2026-09-04"
opponent = "Bel Air"
designation = "scrimmage"        # scrimmages never touch the W-L record
home_away = "home"
# [JC, opponent] per set, in order.
sets = [[25, 10], [25, 19], [25, 12]]

# Per-set tallies from the assistant coach's sheet, one entry per set.
[stats]
aces                 = [6, 2, 6]
service_errors       = [3, 7, 4]
kills                = [12, 10, 6]
blocks               = [0, 0, 1]
attack_errors        = [1, 3, 1]
communication_errors = [0, 2, 0]
net_violations       = [1, 0, 1]
doubles_lifts        = [0, 0, 0]

# Read off the official book: the running score at the END of each service term,
# in order, for each team. Transcribed 2026-09-05 from
# 2026-09-04--vs-Bel-Air-Scorebook-p1.jpg (sets 1-2) and -p2.jpg (set 3).
[scorebook]
first_serve = ["jc", "opp", "jc"]
jc = [
  [4, 6, 10, 13, 18, 21, 23, 25],
  [2, 3, 6, 9, 13, 14, 16, 21, 25],
  [8, 9, 12, 17, 19, 20, 21, 22, 24, 25],
]
opp = [
  [1, 2, 4, 5, 7, 9, 10],
  [4, 7, 8, 9, 10, 11, 12, 16, 19],
  [1, 2, 3, 5, 6, 7, 8, 11, 12],
]

# No [serve_receive] block: the 9/4 passing sheet is a whole-match tally grid
# (names x 3/2/1/0), not the per-set libero tracking sheet, so per-set digits do
# not exist for this match. Team rating off that grid is 2.5 on 19 tracked
# receptions; Hudl rated the full 33 receptions at 1.76. See [notes] sr_rating.

# Official Hudl Assist match totals — the authoritative public numbers. The
# per-set [stats] above are the live tally sheet, counted in the gym; these are
# counted off the film. They disagree on aces (tally 14, official 12), kills
# (tally 28, official 32) and blocks (tally 1, official 0); the official count
# is what the site publishes.
[official]
source = "2026-09-04--vs-Bel-Air-Hudl-Match-Totals.csv"
aces = 12
kills = 32
blocks = 0
assists = 30
digs = 18

[recap]
headline = "Home opener: 3-0 scrimmage win over Bel Air"
body = """
John Carroll closed the preseason with a 3-0 scrimmage win over Bel Air, \
25-10, 25-19, 25-12, splitting the two tune-up matches after a five-set opener \
against Harford Tech. The afternoon belonged to the whole roster — every player \
who came off the bench found a way into the result. Jackson DeReamer had \
an outstanding day on the outside, 14 of the team's 32 kills, and Peyton \
Williams added five more alongside three apiece from Julian Young and Luke \
Boyle. Mason Proctor ran the offense for 18 assists, with Gregg Wisniewski and \
Boyle sharing the rest, and Proctor also led the day at the service line with \
four of John Carroll's 12 aces. The passing gave the offense that platform: a \
1.76 team serve-receive rating across the match, with Andrew Hall (2.50) and \
Tyler Olivi (2.14) steadiest in the back court and Logan Sosnowski right behind \
them. Bel Air pushed hardest in the second, answering an early John Carroll \
lead and trading runs into the twenties before the Patriots closed it out on a \
four-point run. Defensively Williams led with six digs and Proctor added four. \
A complete team performance to build on before the conference opener at \
Spalding.\
"""

# Rows the tally sheet cannot answer — one mark per set (✅/❌, or a dot to
# leave unanswered).
[report_card]
rotation        = "✅✅✅"   # TK 9/5: nothing to note
meet_center     = "✅✅✅"   # TK 9/5: nothing to note
no_complaints   = "✅✅✅"   # TK 9/5: nothing to note
energy          = "✅✅✅"
sr_rating       = "✅✅✅"   # off the 9/4 passing grid (2.5 match); see notes
defensive_play  = "✅✅✅"

# Optional per-row comments on the report card, keyed by criterion.
[notes]
transcription = """
The 9/4 game file itself was lost — this one was rebuilt on 2026-09-05 from the \
rendered stats note and report card (set scores, per-set tallies, recap) plus a \
fresh transcription of the scorebook scans. Two things to settle:

- **Set 2, JC second rotation** — the book has a crossed-out entry in position I \
that was re-written into position II. Reading it as a one-point term (JC 14) is \
what makes the two teams' service terms alternate and land on 25-19; every other \
term in the set reads cleanly. The run and race-to-15 rows come out the same \
either way.
- **Communication errors, S2** — the tally sheet records 2, which is what marks \
that row ❌. TK's 9/5 note was that there were no communication issues, so this \
may be a tally-sheet miscount rather than a real pair of errors.
"""
sr_rating = "Two sheets disagree: the 9/4 passing grid (whole-match tally, 19 receptions tracked) rates the team 2.5; Hudl rated all 33 receptions at 1.76. Marks follow the passing grid."
service_errors = "14 SE, level with the tally's 14 aces — the S2 spike (7) is where the set got close"
blocks = "Tally sheet had 1 (S3); Hudl's official box score credits none"
kills = "32 kills officially — S1 12, S2 10, S3 6 on the live tally"
aces_over_se = "S1 6-3 and S3 6-4; S2 went the other way at 2-7"
